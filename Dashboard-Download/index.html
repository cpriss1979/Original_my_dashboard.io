const mediaTracks=[['Music of the Night','77umP7IRxD4'],['Way Maker','iJCV_2H9xD0'],['Glow in the Dark','Jb1TTADzf9Y'],['Peaceful','OO2kPK5-qno']];const miniMedia=document.createElement('section');miniMedia.className='dashboard-music';miniMedia.innerHTML=`<div class="music-toolbar"><span>♫ Media</span>${mediaTracks.map((t,i)=>`<button class="music-track" data-media="${i}" aria-pressed="false">${t[0]}</button>`).join('')}<button class="music-stop" id="miniStop" disabled>Stop</button></div><div class="mini-media-row" id="miniMediaRow" hidden><iframe id="miniYoutube" title="Miniature YouTube player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><div><p id="miniTitle"></p><p class="music-help">Press Play inside the miniature video. Use its controls for pause and volume. You can switch dashboard pages while listening.</p></div></div><p id="localMediaHelp" class="music-help" hidden>For playback inside the dashboard, open it using Start-Dashboard.command from the ZIP, rather than double-clicking this HTML file.</p>`;document.querySelector('main>.top').after(miniMedia);if(location.protocol==='file:')document.getElementById('localMediaHelp').hidden=false;miniMedia.querySelectorAll('[data-media]').forEach(b=>b.onclick=()=>{const t=mediaTracks[Number(b.dataset.media)];miniMedia.querySelectorAll('[data-media]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));miniMediaRow.hidden=false;miniTitle.textContent=t[0];miniYoutube.src='https://www.youtube.com/embed/'+t[1]+'?controls=1&autoplay=1&playsinline=1&rel=0';miniStop.disabled=false});miniStop.onclick=()=>{miniYoutube.removeAttribute('src');miniMediaRow.hidden=true;miniStop.disabled=true;miniMedia.querySelectorAll('[data-media]').forEach(b=>b.setAttribute('aria-pressed','false'))};
</script></body></html>
